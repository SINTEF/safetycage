[build-system]
requires = ["uv_build >= 0.10.0, <0.11.0"]
build-backend = "uv_build"

[project]
name = "safetycage"
version = "0.0.54"
authors = [
    { name="Pål Vegard Bun Johnsen", email="pal.johnsen@sintef.no" },
    { name="Joel Bjervig", email="Joel.Bjervig@sintef.no" },
    { name="Julia Qiu", email="Julia.Qiu@sintef.no" },
]
description = "The official safetycage package for misclassification detection in predictive models."
readme = "README.md"
requires-python = "==3.11.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "joblib==1.3.2",
    "matplotlib==3.8.2",
    "numpy>=1.25.2",
    "scikit-learn==1.1.3",
    "scipy==1.9.3",
    "statsmodels==0.13.5",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
red = ["gpytorch>=1.9", "torch>=1.13"]

[project.urls]
Homepage = "https://github.com/safety-cage/safetycage"
Issues = "https://github.com/safety-cage/safetycage/issues"

[tool.uv]
package = true

[tool.uv.sources]
safetycage-testing = { workspace = true }
