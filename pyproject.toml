[build-system]
requires = ["uv_build >= 0.10.0, <0.11.0"]
build-backend = "uv_build"

[project]
name = "safetycage"
version = "0.0.58"
authors = [
    { name="Pål Vegard Bun Johnsen", email="pal.johnsen@sintef.no" },
    { name="Joel Bjervig", email="Joel.Bjervig@sintef.no" },
    { name="Julia Qiu", email="Julia.Qiu@sintef.no" },
]
description = "The official safetycage package for misclassification detection in predictive models."
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.13"

dependencies = [
    "joblib",
    "matplotlib",
    "numpy==2.5.2",
    "tqdm",
]

[project.optional-dependencies]
red = ["gpytorch>=1.9", "torch>=1.13"]
spardacus = ["statsmodels>=0.14.6", "scikit-learn==1.9.0", "scipy"]
mahalanobis = ["statsmodels>=0.14.6", "scikit-learn==1.9.0", "scipy"]

[dependency-groups]
# Local-only tooling for examples/. A PEP 735 group rather than an extra, so
# none of this reaches the published wheel's metadata.
examples = [
    "torch>=1.13",
    "torchvision>=0.15",
    "ipykernel>=7",
    "jupyter>=1.1",
    "nbformat>=5.10",
]
docs = [
    "sphinx>=7.3",
    "furo>=2024.1",
    "myst-nb>=1.1",
]

[project.urls]
Homepage = "https://github.com/SINTEF/safetycage"
Issues = "https://github.com/SINTEF/safetycage/issues"
Changelog = "https://github.com/SINTEF/safetycage/blob/main/CHANGELOG.md"
# Documentation is published by Read the Docs. Its URL carries no owner name,
# so it survives the repository moving between accounts or organisations —
# which matters because PyPI metadata is immutable once a release is cut.
Documentation = "https://safetycage.readthedocs.io/"

[tool.uv]
package = true

[tool.uv.sources]
safetycage-testing = { workspace = true }
