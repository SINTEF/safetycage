# Documentation build check.
#
# The docs are published by Read the Docs, which builds from the GitHub
# mirror. This pipeline only verifies that the build still succeeds, so a
# broken docstring fails review rather than reaching Read the Docs.

image: python:3.11.7-slim

variables:
  # Keep uv's downloads inside the project so GitLab's cache can see them.
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

docs:check:
  stage: test

  before_script:
    - pip install --quiet uv

  script:
    # -W turns warnings into errors, matching the Read the Docs build, so a
    # malformed docstring fails here rather than degrading the published page.
    - uv run --group docs sphinx-build -W -b html docs docs/_build/html

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
