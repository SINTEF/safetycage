# Documentation build and GitLab Pages deployment.
#
# GitLab Pages requires a job literally named `pages` whose artifacts land in
# a top-level `public/` directory. Sphinx builds into docs/_build/html, so the
# job moves the result into place afterwards.

image: python:3.11.7-slim

variables:
  # Keep uv's downloads inside the project so GitLab's cache can see them.
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache

pages:
  stage: deploy

  before_script:
    - pip install --quiet uv

  script:
    # -W turns warnings into errors, so a malformed docstring fails the build
    # here rather than silently degrading the published page.
    - uv run --group docs sphinx-build -W -b html docs public

  artifacts:
    paths:
      - public

  rules:
    # Pages only publishes from the default branch.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Build the docs on merge requests too, so breakage is caught before it
# reaches the default branch. Same command, no artifact, nothing published.
docs:check:
  stage: test

  before_script:
    - pip install --quiet uv

  script:
    - uv run --group docs sphinx-build -W -b html docs docs/_build/html

  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
