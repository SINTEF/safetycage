name: docs

# Read the Docs publishes the documentation; this workflow only verifies that
# the build still succeeds. It runs on pull requests so a malformed docstring
# fails review rather than reaching Read the Docs, and on main as a backstop
# for pushes that bypassed review.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets you re-run the check from the Actions tab without a new commit.
  workflow_dispatch:

# One check per ref is enough; a newer push supersedes an in-flight one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # pyproject pins requires-python to ==3.11.7, so uv must fetch that
      # exact patch release rather than whatever 3.11.x the runner ships.
      - run: uv python install 3.11.7

      # -W turns warnings into errors. Read the Docs deliberately builds
      # without it, so that a third-party intersphinx outage degrades some
      # cross-links rather than blocking publication; catching the warnings
      # it lets through is the whole point of this job.
      - run: uv run --group docs sphinx-build -W -b html docs docs/_build/html
