# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    install:
      - pip install uv
      # pyproject.toml pins requires-python to ==3.11.7, and Read the Docs'
      # generic "3.11" is some other patch release, so uv fetches the exact
      # version and runs against that rather than the build image's Python.
      - uv python install 3.11.7
    build:
      html:
        # Sphinx lives in the PEP 735 `docs` dependency group, which Read the
        # Docs does not install on its own.
        #
        # No -W here, unlike the `docs` GitHub Actions workflow. Content
        # errors are already caught there before merge; on Read the Docs the
        # only extra thing -W would catch is intersphinx failing to reach
        # numpy.org or scikit-learn.org, which would block publishing over a
        # third-party outage that at worst degrades some cross-links.
        - uv run --group docs sphinx-build -b html docs $READTHEDOCS_OUTPUT/html

sphinx:
  configuration: docs/conf.py
